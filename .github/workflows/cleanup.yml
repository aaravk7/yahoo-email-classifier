name: Yahoo Email Cleanup

on:
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - run: node index.js cleanup
        env:
          YAHOO_USER: ${{ secrets.YAHOO_USER }}
          YAHOO_PASS: ${{ secrets.YAHOO_PASS }}
